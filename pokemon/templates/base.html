{% load static %}

<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Pokédex Premium</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <!-- CSS do projeto -->
    <link
        rel="stylesheet"
        href="{% static 'css/style.css' %}"
    >

</head>

<body class="text-light">

    <!-- ============================= -->
    <!-- NAVBAR -->
    <!-- ============================= -->

   {% include "includes/navbar.html" %}


    <!-- ============================= -->
    <!-- HEADER -->
    <!-- ============================= -->

    <header class="header-premium py-1">

        <div class="container text-center">

            <div
                class="d-flex justify-content-center align-items-center gap-3"
            >

                <!-- Pikachu -->
                <img
                    src="{% static 'img/png-clipart-pikachu-euclidean-ball-open-the-red-ball-wizard-pet-elf-removebg-preview.png' %}"
                    alt="Pikachu"
                    class="logo-pokedex hover-premium"
                >

                <!-- Logo Pokémon -->
                <img
                    src="{% static 'img/logo-pokemon-png-preview-removebg-preview.png' %}"
                    alt="Pokédex"
                    class="logo-titulo"
                >

            </div>

            <div class="title-line mx-auto mt-3"></div>

        </div>

    </header>


    <!-- ============================= -->
    <!-- CONTEÚDO -->
    <!-- ============================= -->

    <main>

        {% block content %}
        {% endblock %}

    </main>


    <!-- ============================= -->
    <!-- FOOTER -->
    <!-- ============================= -->

   {% include "includes/footer.html" %}


    <!-- ============================= -->
    <!-- BOOTSTRAP JAVASCRIPT -->
    <!-- ============================= -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>


    <!-- ============================= -->
    <!-- JAVASCRIPT DO PROJETO -->
    <!-- ============================= -->

    <script src="{% static 'js/script.js' %}"></script>

</body>

</html>
